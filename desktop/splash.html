<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>ForgeMesh Control Center</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f9;
        --panel: #ffffff;
        --panel-3: #eef2f7;
        --accent: #3b5bdb;
        --accent-rgb: 59, 91, 219;
        --accent-wash: #eef2fd;
        --text: #333c48;
        --text-strong: #1a2029;
        --muted: #68737f;
        --muted-2: #838d99;
        --line: #d9e0ea;
        --line-strong: #c3ccd9;
        --ok: #178a4c;
        --ok-text: #0f6b3c;
        --bad: #c2392f;
        --bad-text: #a52d24;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", "Segoe UI", Ubuntu, Arial, sans-serif;
        font-size: 13px;
        -webkit-app-region: drag;
        user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 22px 26px 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }
      .head { display: flex; align-items: center; gap: 12px; }
      .mark { width: 30px; height: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
      .mark i { border: 1px solid var(--line-strong); border-radius: 2px; }
      .mark i:nth-child(2), .mark i:nth-child(3) { background: var(--accent-wash); border-color: var(--accent); }
      .head strong { display: block; font-size: 13px; letter-spacing: 0.18em; color: var(--accent); font-weight: 600; }
      .head span { display: block; font-size: 11px; letter-spacing: 0.16em; color: var(--muted-2); text-transform: uppercase; }
      h1 { margin: 20px 0 2px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-strong); }
      .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
      .stages { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
      .stage { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--muted-2); }
      .stage .dot {
        width: 18px; height: 18px; flex: 0 0 auto; border-radius: 50%;
        border: 1px solid var(--line-strong); display: grid; place-items: center; font-size: 11px;
      }
      .stage .detail { margin-left: auto; font-size: 11px; color: var(--muted); font-family: "JetBrains Mono", monospace; max-width: 320px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .stage.active { color: var(--text-strong); }
      .stage.active .dot { border-color: rgba(var(--accent-rgb), 0.55); background: var(--accent-wash); color: var(--accent); animation: spin 1.4s linear infinite; }
      .stage.done { color: var(--ok-text); }
      .stage.done .dot { border-color: rgba(23, 138, 76, 0.45); background: rgba(23, 138, 76, 0.10); color: var(--ok); }
      .stage.failed { color: var(--bad-text); }
      .stage.failed .dot { border-color: rgba(194, 57, 47, 0.45); background: rgba(194, 57, 47, 0.10); color: var(--bad); }
      @keyframes spin { to { transform: rotate(360deg); } }
      .bar { height: 4px; border-radius: 2px; background: var(--panel-3); overflow: hidden; margin: 15px 0 12px; }
      .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 280ms ease; }
      .log {
        flex: 1; min-height: 46px; overflow: hidden; font-family: "JetBrains Mono", monospace;
        font-size: 11px; color: var(--muted); line-height: 1.5; white-space: pre-wrap;
        border-top: 1px solid var(--line); padding-top: 9px;
      }
      .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
      .meta { font-size: 11px; color: var(--muted-2); letter-spacing: 0.05em; }
      .error { display: none; border: 1px solid rgba(194, 57, 47, 0.32); background: rgba(194, 57, 47, 0.06); color: var(--bad-text); border-radius: 6px; padding: 9px 11px; font-size: 11px; line-height: 1.5; margin: 6px 0 0; max-height: 96px; overflow: auto; }
      .actions { display: none; gap: 8px; -webkit-app-region: no-drag; }
      .actions button {
        -webkit-app-region: no-drag;
        padding: 7px 13px; border-radius: 6px; font-size: 12px; cursor: pointer;
        border: 1px solid var(--line-strong); background: var(--panel); color: var(--text);
      }
      .actions button.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; font-weight: 600; }
      .footer-note { font-size: 11px; color: var(--muted-2); }
      body.failed .bar { background: rgba(194, 57, 47, 0.12); }
      body.failed .bar i { background: var(--bad); }
      body.failed .actions { display: flex; }
      body.failed .error { display: block; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div>
          <strong>FORGEMESH</strong>
          <span>AI Control Center</span>
        </div>
      </div>

      <h1>Starting ForgeMesh</h1>
      <p class="sub">Real startup progress from the control server process.</p>

      <div class="stages" id="stages"></div>
      <div class="bar"><i id="progress"></i></div>
      <div class="error" id="error"></div>
      <div class="log" id="log">Preparing…</div>

      <div class="foot">
        <span class="meta" id="meta">elapsed 0.0s</span>
        <div class="actions">
          <button id="retry" class="primary">Retry startup</button>
          <button id="quit">Quit</button>
        </div>
        <span class="footer-note">Central server only</span>
      </div>
    </div>
    <script src="splash.js"></script>
  </body>
</html>
